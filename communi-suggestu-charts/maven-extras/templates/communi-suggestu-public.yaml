apiVersion: maven.operator.io/v1alpha1
kind: MavenRepository
metadata:
  name: public
spec:
  type: Virtual
  virtual:
    members:
      {{- range .Values.repositories.hosted }}
      - {{ .name | quote }}
      {{- end }}
  ingress:
    enabled: true
    host: {{ $.Values.gateway.domain }}
    certManager:
      issuerName: letsencrypt-production
      isClusterIssuer: true
      renewBefore: "1440h"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      external-dns.alpha.kubernetes.io/target: "cluster.ldtteam.com"
  auth:
    download:
      policy: Anonymous
    upload:
      policy: Authenticated
      users: []
    