apiVersion: maven.operator.io/v1alpha1
kind: MavenRepository
metadata:
  name: public
spec:
  type: Virtual
  virtual:
    members:
      {{- range .Values.repositories.hosted }}
      - {{ .name | quote }}
      {{- end }}
  gateway:
    enabled: true
    gatewayRef:
      name: traefik-gateway
      namespace: traefik
    certManager:
      issuerName: letsencrypt-production
      isClusterIssuer: true
      renewBefore: "1440h"
    hostname: {{ $.Values.gateway.domain }}
  auth:
    download:
      policy: Anonymous
    upload:
      policy: Authenticated
      users: []
    